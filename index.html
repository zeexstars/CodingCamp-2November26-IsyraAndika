<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Budget Visualizer</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- App shell: flex column, max-width, centered -->
  <main class="app">
    <!-- Header with Total Balance Display at the top (Requirement 4.1) -->
    <header class="app__header">
      <h1 class="app__title">Expense Budget Visualizer</h1>
      <div class="total-balance">
        <span class="total-balance__label">Total Balance</span>
        <span class="total-balance__amount" id="total-balance">0.00</span>
      </div>
      <!-- Non-blocking persistence-failure message -->
      <div id="persistence-error" class="persistence-error" role="alert" hidden></div>
    </header>

    <!-- Input form for adding a transaction -->
    <section class="form-section" aria-labelledby="form-heading">
      <h2 id="form-heading" class="section-title">Add Expense</h2>
      <form id="expense-form" class="expense-form" novalidate>
        <div class="form-field">
          <label for="item-name">Item Name</label>
          <input
            type="text"
            id="item-name"
            name="item-name"
            maxlength="50"
            placeholder="e.g. Lunch"
            autocomplete="off"
          />
        </div>
        <div class="form-field">
          <label for="amount">Amount</label>
          <input
            type="text"
            id="amount"
            name="amount"
            inputmode="decimal"
            placeholder="e.g. 12.50"
            autocomplete="off"
          />
        </div>
        <div class="form-field">
          <label for="category">Category</label>
          <select id="category" name="category">
            <option value="" disabled selected>Select a category</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Fun</option>
          </select>
        </div>
        <!-- Primary action: larger than secondary controls (Requirement 9.1) -->
        <button type="submit" id="add-button" class="btn btn--primary">Add Expense</button>
      </form>
      <!-- Validation messages rendered near the form -->
      <div id="validation-messages" class="validation-messages" role="alert" hidden></div>
    </section>

    <!-- Body: transaction list + chart laid out responsively -->
    <div class="app__body">
      <!-- Scrollable transaction list (Requirement 2.4) -->
      <section class="transaction-list-section" aria-labelledby="list-heading">
        <h2 id="list-heading" class="section-title">Transactions</h2>
        <div id="transaction-list" class="transaction-list" role="list">
          <!-- Empty state indication when no transactions exist -->
          <p id="list-empty-state" class="empty-state">No transactions yet. Add your first expense above.</p>
        </div>
      </section>

      <!-- Chart container for the SVG pie chart -->
      <section class="chart-section" aria-labelledby="chart-heading">
        <h2 id="chart-heading" class="section-title">Spending by Category</h2>
        <div id="chart-container" class="chart-container">
          <!-- Empty state indication when no spending data is available -->
          <p id="chart-empty-state" class="empty-state">No spending data available.</p>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
